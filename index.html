  <!--@critical-css-->
  <script>
  /* Swap no-js, then start the CSS splash intro once the wordmark font is ready (700ms cap). */
  (function (d) {
    var r = d.documentElement;
    r.classList.replace('no-js', 'js');
    try { if (sessionStorage.getItem('forge:splash-seen') === '1') r.classList.add('splash-repeat'); } catch (e) {}
    var go = function () {
      if (r.classList.contains('splash-go')) return;
      window.__splashT0 = performance.now();
      r.classList.add('splash-go');
      d.dispatchEvent(new Event('splash-go'));
    };
    setTimeout(go, 700);
    if (d.fonts && d.fonts.load) d.fonts.load('900 1em Archivo').then(go, go); else go();
  })(document);
  </script>
