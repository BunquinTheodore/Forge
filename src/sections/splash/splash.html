<div class="splash" aria-hidden="true" data-splash>
  <div class="splash__panel splash__panel--top"></div>
  <div class="splash__panel splash__panel--bottom"></div>
  <div class="splash__stage">
    <div class="splash__presents">
      <img class="splash__logo" src="/img/iccpi-logo.webp" alt="" width="56" height="56" decoding="async" />
      <span class="splash__by">ICCPI presents</span>
    </div>
    <div class="splash__mark">
      <span class="splash__word splash__word--steel">FORGE</span>
      <span class="splash__word splash__word--hot">FORGE</span>
    </div>
    <div class="splash__forge">
      <span class="splash__line"><span class="splash__spark"></span></span>
      <span class="splash__heat"><span class="splash__count">000</span><span class="splash__unit">heat</span></span>
    </div>
    <span class="splash__skip">Tap or press any key to skip</span>
  </div>
</div>
